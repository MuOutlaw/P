<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>غير متصل — الصفاة</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Segoe UI', Tahoma, sans-serif;
        background: #f9fafb;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 2rem;
      }
      .icon { font-size: 64px; margin-bottom: 1.5rem; }
      h1 { font-size: 1.5rem; font-weight: 800; color: #111827; margin-bottom: 0.5rem; }
      p { color: #6b7280; font-size: 0.95rem; line-height: 1.6; margin-bottom: 1.5rem; }
      button {
        background: #16a34a;
        color: white;
        border: none;
        padding: 0.75rem 2rem;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { background: #15803d; }
    </style>
  </head>
  <body>
    <div>
      <div class="icon">🐪</div>
      <h1>أنت غير متصل بالإنترنت</h1>
      <p>تحقق من اتصالك بالشبكة وأعد المحاولة.</p>
      <button onclick="window.location.reload()">إعادة المحاولة</button>
    </div>
  </body>
</html>
